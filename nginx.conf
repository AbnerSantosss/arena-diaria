server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # URL única para a home (evita duplicidade / x /index.html)
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /;
    }

    # URLs antigas (versão brasileira) apontam para as notas equivalentes da Argentina
    rewrite ^/noticia-brasileirao-rodada\.html$ /noticia-liga-profesional.html permanent;
    rewrite ^/noticia-selecao-brasileira\.html$ /noticia-seleccion-argentina.html permanent;
    rewrite ^/noticia-copa-do-brasil\.html$ /noticia-copa-argentina.html permanent;
    rewrite ^/noticia-patrocinios-futebol\.html$ /noticia-sponsors-futbol-argentino.html permanent;
    rewrite ^/noticia-direitos-de-transmissao\.html$ /noticia-derechos-de-transmision.html permanent;
    rewrite ^/noticia-saf-sociedade-anonima-futebol\.html$ /noticia-sad-sociedades-anonimas-deportivas.html permanent;
    rewrite ^/noticia-ingressos-direitos-torcedor\.html$ /noticia-entradas-derechos-hincha.html permanent;
    rewrite ^/noticia-pix-golpes-med\.html$ /noticia-estafas-transferencias.html permanent;
    rewrite ^/quem-somos\.html$ /quienes-somos.html permanent;
    rewrite ^/contato\.html$ /contacto.html permanent;
    rewrite ^/anuncie\.html$ /anuncia.html permanent;
    rewrite ^/termos-de-uso\.html$ /terminos-de-uso.html permanent;
    rewrite ^/politica-de-privacidade\.html$ /politica-de-privacidad.html permanent;
    rewrite ^/assets/images/og-arena-diaria\.jpg$ /assets/images/og-pasion.jpg permanent;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(webp|jpg|jpeg|png|gif|ico|svg|woff2|css|js|mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /llms.txt {
        default_type "text/plain; charset=utf-8";
    }
}
