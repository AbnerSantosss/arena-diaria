<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1940, height=500">
<!-- Billboard 970x250 da home (acima da manchete), desenhado em 970x250 e renderizado em 2x. Animação de 6 s: entrada, brilho e pulso no botão; termina no quadro completo.
     O quadro final vira assets/images/anuncios/billboard.webp. -->
<style>
@font-face{font-family:"Titulo";src:url("assets/Montserrat-ExtraBold.ttf") format("truetype");font-display:block}
@font-face{font-family:"Texto";src:url("assets/Inter-SemiBold.ttf") format("truetype");font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1940px;height:500px;overflow:hidden;background:#0B132B}
#root{position:relative;width:1940px;height:500px;overflow:hidden}
#arte{position:absolute;left:0;top:0;width:970px;height:250px;transform:scale(2);transform-origin:0 0;
  background:linear-gradient(110deg,#0B132B 0%,#1C2541 58%,#134E4A 100%);overflow:hidden}
#campo{position:absolute;right:-150px;top:-35px;width:420px;height:320px;opacity:.16}
#marca{position:absolute;left:44px;top:0;height:250px;display:flex;align-items:center;gap:12px}
#marca svg{width:44px;height:44px}
#nome{font-family:"Titulo";font-size:21px;color:#fff;letter-spacing:-.01em}
#nome b{color:#5EEAD4;font-weight:inherit}
#linha{position:absolute;left:258px;top:62px;width:1px;height:126px;background:rgba(255,255,255,.22)}
#texto{position:absolute;left:292px;top:0;height:250px;width:440px;display:flex;flex-direction:column;justify-content:center}
#chapeu{font-family:"Texto";font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5EEAD4}
#titulo{font-family:"Titulo";font-size:38px;line-height:1.06;color:#fff;margin-top:8px;letter-spacing:-.015em}
#sub{font-family:"Texto";font-size:15px;line-height:1.4;color:#CBD5E1;margin-top:12px}
#cta{position:absolute;overflow:hidden;right:52px;top:96px;height:58px;padding:0 30px;border-radius:999px;background:#5EEAD4;
  color:#0B132B;font-family:"Titulo";font-size:19px;display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 30px rgba(94,234,212,.25)}
#seta{display:inline-block}
#brilho{position:absolute;top:0;left:0;width:45%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 100%);transform:translateX(-120%) skewX(-18deg)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1940" data-height="500" data-duration="6" data-fps="30">
 <div id="arte">
  <svg id="campo" viewBox="0 0 420 320" fill="none" stroke="#5EEAD4" stroke-width="2">
    <rect x="1" y="1" width="418" height="318"/><line x1="210" y1="1" x2="210" y2="319"/>
    <circle cx="210" cy="160" r="62"/><circle cx="210" cy="160" r="3" fill="#5EEAD4"/>
    <rect x="1" y="80" width="70" height="160"/><rect x="349" y="80" width="70" height="160"/>
  </svg>
  <div id="marca">
    <svg viewBox="0 0 100 100" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A896"/><stop offset="1" stop-color="#0F766E"/></linearGradient></defs>
      <path d="M50 10 L90 25 L90 60 C90 85 65 95 50 100 C35 95 10 85 10 60 L10 25 Z" fill="url(#g)"/>
      <path d="M35 55 L45 65 L70 35" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="nome">PASION</span>
  </div>
  <div id="linha"></div>
  <div id="texto">
    <span id="chapeu">Espaço publicitário</span>
    <span id="titulo">Tu marca arriba<br>del titular</span>
    <span id="sub">Hablá con quienes siguen el fútbol, la economía<br>del deporte y los derechos del consumidor.</span>
  </div>
  <div id="cta"><span id="brilho"></span>Anunciá acá <span id="seta">→</span></div>
 </div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  tl.set("#seta", { x: 0 }, 0);
  tl.fromTo("#campo", { opacity: 0, x: 40 }, { opacity: 0.16, x: 0, duration: 0.8, ease: "power2.out" }, 0);
  tl.fromTo("#marca", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.1);
  tl.fromTo("#linha", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out" }, 0.3);
  tl.fromTo("#chapeu", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.35);
  tl.fromTo("#titulo", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.45);
  tl.fromTo("#sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.7);
  tl.fromTo("#cta", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.95);
  tl.fromTo("#seta", { x: 0 }, { x: 6, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.5);
  tl.fromTo("#brilho", { xPercent: -120 }, { xPercent: 340, duration: 0.7, ease: "power2.inOut" }, 2.2);
  tl.to("#cta", { scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 3.4);
  tl.fromTo("#seta", { x: 0 }, { x: 6, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 3.5);
  tl.fromTo("#brilho", { xPercent: -120 }, { xPercent: 340, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 4.6);
  tl.to({}, { duration: 0.01 }, 5.99);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
})();
</script>
</body>
</html>
